# Tres servidores, um por cidade:
#   sp  -> SP, o mais perto do usuario
#   rj  -> RJ, mais longe
#   ba  -> BA, mais longe ainda
#
# N=2: cada carrinho fica em 2 dos 3 servidores. O terceiro nao guarda o
# carrinho, mas pode receber um "recado" (hinted handoff) quando um dos dois
# esta fora. Com N=3 e 3 servidores nao haveria terceiro para o recado.
#
#   docker compose up -d --build                     -> sobe os 3
#   docker compose --profile bench run --rm bench    -> roda um experimento
#   docker compose stop rj                           -> derruba um servidor

x-no-comum: &no-comum
  build: .
  image: minidynamo:1.0.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
    interval: 3s
    timeout: 2s
    retries: 10
    start_period: 2s
  networks: [dynamo]

x-env-comum: &env-comum
  HTTP_PORT: "8080"
  PEERS: "sp@sp:8080,rj@rj:8080,ba@ba:8080"

  # N = quantos servidores guardam cada carrinho. Fixo no cluster.
  REPLICATION_N: "2"
  # R e W sao por REQUISICAO (?r= e ?w=). Estes sao os padroes quando o cliente
  # nao escolhe: com N=2, quorum = 2 de 2.
  DEFAULT_R: "2"
  DEFAULT_W: "2"

  # Nos virtuais por servidor. Mais = carga mais uniforme.
  VNODES: "128"

  # Timeout de uma chamada a um servidor, e o prazo total para juntar R ou W
  # respostas.
  RPC_TIMEOUT_MS: "800"
  REPLICATION_TIMEOUT_MS: "1500"

  # Intervalo do laco que reentrega os recados. Domina o tempo de recuperacao
  # medido na demo de queda.
  HINT_DELIVERY_MS: "2000"

  # Intervalo da anti-entropia (troca de resumo com um par sorteado). Domina o
  # tempo de convergencia sem leitura.
  ANTI_ENTROPY_MS: "5000"
  ANTI_ENTROPY_ENABLED: "true"

services:
  sp:
    <<: *no-comum
    container_name: md-sp
    environment:
      <<: *env-comum
      NODE_ID: sp
    ports: ["8081:8080"]

  rj:
    <<: *no-comum
    container_name: md-rj
    environment:
      <<: *env-comum
      NODE_ID: rj
    ports: ["8082:8080"]

  ba:
    <<: *no-comum
    container_name: md-ba
    environment:
      <<: *env-comum
      NODE_ID: ba
    ports: ["8083:8080"]

  # Gerador de carga e verificador de consistencia. Nao sobe com o cluster.
  bench:
    build: .
    image: minidynamo:1.0.0
    profiles: ["bench"]
    networks: [dynamo]
    depends_on:
      sp: {condition: service_healthy}
      rj: {condition: service_healthy}
      ba: {condition: service_healthy}
    environment:
      NODES: "http://sp:8080,http://rj:8080,http://ba:8080"
    volumes:
      - ./resultados:/app/resultados
    entrypoint: ["java", "-cp", "/app/minidynamo.jar", "sd.minidynamo.bench.Bench"]

networks:
  dynamo:
    driver: bridge
